<!DOCTYPE html>
<!--
  FrequencyManager - Web Entry Point
  ──────────────────────────────────────────────────────────────────────────
  Same renderer bundle (src/main.tsx, App.tsx, everything under src/renderer/src)
  as the Electron build — there is no separate "web" source tree. This file
  only differs from index.html in ways a plain browser actually needs: no
  `fm-icon:` custom-protocol CSP source (Electron-only), and this comment.
  See docs/WEB_VERSION.md for what's different in the web build overall.
-->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--
          WHY a strict CSP: same defence-in-depth rationale as the Electron
          build's index.html. `fm-icon:` is dropped — that custom protocol
          only exists inside Electron, so it's meaningless (and would be
          silently ignored either way) in a browser.

          Extra allowances beyond the Electron build, both for the browser
          OCR path (lib/ocrBrowser.ts):
          - `worker-src blob:` — tesseract.js's browser worker is spawned
            from a same-origin-inherited `blob:` URL (the standard workaround
            for the fact that `new Worker()` can't load a cross-origin script
            URL directly).
          - `script-src`/`connect-src` allow cdn.jsdelivr.net — only
            `eng.traineddata` is bundled locally; tesseract.js's own
            worker/wasm-core engine files are still fetched from its default
            CDN the first time OCR runs in a session (see ocrBrowser.ts).
          - `script-src 'wasm-unsafe-eval'` — required by Chromium-based
            browsers to instantiate the WebAssembly OCR engine at all.
          - `img-src blob:` — the scanned-screenshot preview thumbnail is a
            `URL.createObjectURL(file)` blob, not a `data:` URL like
            Electron's `readImagePreview` produces.
          - `connect-src data:` — the WASM core's Emscripten glue script
            embeds the actual `.wasm` binary as a base64 `data:` URI and
            `fetch()`s it from there instead of a second network request.
          - `img-src` allows cdn.jsdelivr.net — character/weapon/gear icons
            (lib/icons.ts) are fetched from this public repo's own
            adapters/*/icons/ folders via jsDelivr's GitHub CDN, since there's
            no `fm-icon://` protocol (or any bundled art) to serve them from
            in a browser. See docs/WEB_VERSION.md.
          - `connect-src` allows raw.githubusercontent.com — Rotation
            Builder's end-game-mode presets (lib/endgamePresets.ts) fetch a
            small JSON manifest from this same repo's `main` branch at
            runtime, deliberately NOT via jsDelivr (its CDN caching can lag
            a fresh commit by up to a day, defeating the point of an
            auto-updating feed). Same trust boundary as the icon CDN above —
            both read from this app's own public repo, no third party.
          - `connect-src` allows genshin-impact.fandom.com/wutheringwaves.
            fandom.com, `img-src` allows static.wikia.nocookie.net — the
            build-card export (lib/characterArt.ts) resolves a character's
            real portrait art live via each wiki's own MediaWiki API, never
            bundled (see docs/superpowers/specs/2026-07-31-build-card-v2-design.md).
        -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net https://static.wikia.nocookie.net; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com https://genshin-impact.fandom.com https://wutheringwaves.fandom.com data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrequencyManager — Damage Calculator &amp; Gear Optimizer</title>
    <meta name="description"
        content="Free damage calculator, gear optimizer, and OCR scanner for Wuthering Waves and Genshin Impact — with community-addable games." />
    <link rel="canonical" href="https://voruzhu.github.io/FrequencyManager/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Twitter Card — link previews (Discord, Twitter, etc). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FrequencyManager" />
    <meta property="og:title" content="FrequencyManager — Damage Calculator &amp; Gear Optimizer" />
    <meta property="og:description"
        content="Free damage calculator, gear optimizer, and OCR scanner for Wuthering Waves and Genshin Impact — with community-addable games." />
    <meta property="og:url" content="https://voruzhu.github.io/FrequencyManager/" />
    <meta property="og:image" content="https://voruzhu.github.io/FrequencyManager/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FrequencyManager — Damage Calculator &amp; Gear Optimizer" />
    <meta name="twitter:description"
        content="Free damage calculator, gear optimizer, and OCR scanner for Wuthering Waves and Genshin Impact — with community-addable games." />
    <meta name="twitter:image" content="https://voruzhu.github.io/FrequencyManager/favicon.svg" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
